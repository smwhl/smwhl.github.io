name: Build Full APK (Server Enterprise)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: "platform-tools platforms;android-34 build-tools;34.0.0"

    - name: Create full Android project
      run: |
        mkdir -p app/src/main/java/com/nexus/server/enterprise
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/menu
        mkdir -p app/src/main/res/mipmap-anydpi-v26

        # settings.gradle
        cat > settings.gradle <<EOF
        rootProject.name = 'Nexus Server'
        include ':app'
        EOF

        # build.gradle (project)
        cat > build.gradle <<EOF
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.5.0' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # app/build.gradle
        cat > app/build.gradle <<'EOF'
        plugins { id 'com.android.application' }
        android {
            namespace 'com.nexus.server.enterprise'
            compileSdk 34
            defaultConfig {
                applicationId 'com.nexus.server.enterprise'
                minSdk 24
                targetSdk 34
                versionCode 3
                versionName '3.0'
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'androidx.webkit:webkit:1.13.0'
            implementation 'com.google.android.material:material:1.12.0'
        }
        EOF

        # AndroidManifest.xml
        cat > app/src/main/AndroidManifest.xml <<EOF
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
            <uses-permission android:name="android.permission.DOWNLOAD_WITHOUT_NOTIFICATION"/>
            <uses-permission android:name="android.permission.ACCESS_DOWNLOAD_MANAGER"/>
            <application
                android:label="Nexus Server"
                android:usesCleartextTraffic="true"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:theme="@style/Theme.NexusServer">
                <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # themes.xml
        cat > app/src/main/res/values/themes.xml <<'XML'
        <resources>
            <style name="Theme.NexusServer" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="colorPrimary">#2196F3</item>
                <item name="colorPrimaryVariant">#1976D2</item>
                <item name="colorOnPrimary">#FFFFFF</item>
            </style>
        </resources>
        XML

        # colors.xml
        cat > app/src/main/res/values/colors.xml <<'XML'
        <?xml version="1.0"?>
        <resources>
            <color name="ic_launcher_background">#2196F3</color>
        </resources>
        XML

        # icon vector (server)
        cat > app/src/main/res/drawable/ic_server.xml <<'XML'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#2196F3"
                android:pathData="M0,0h108v108h-108z"/>
            <path
                android:fillColor="#FFFFFF"
                android:pathData="M36,36 L72,36 A4,4 0 0,1 76,40 L76,68 A4,4 0 0,1 72,72 L36,72 A4,4 0 0,1 32,68 L32,40 A4,4 0 0,1 36,36 Z"/>
            <path
                android:fillColor="#FFFFFF"
                android:pathData="M44,48 L64,48 L64,52 L44,52 Z"/>
            <path
                android:fillColor="#FFFFFF"
                android:pathData="M44,56 L58,56 L58,60 L44,60 Z"/>
            <circle
                android:fillColor="#FFFFFF"
                android:cx="68"
                android:cy="58"
                android:r="3"/>
        </vector>
        XML

        # adaptive icon
        cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
        <?xml version="1.0"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_server"/>
        </adaptive-icon>
        XML

        # layout dengan bottom navigation
        cat > app/src/main/res/layout/activity_main.xml <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical">
            <WebView
                android:id="@+id/webview"
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1" />
            <com.google.android.material.bottomnavigation.BottomNavigationView
                android:id="@+id/bottom_nav"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                app:menu="@menu/bottom_nav_menu" />
        </LinearLayout>
        XML

        # menu resource
        cat > app/src/main/res/menu/bottom_nav_menu.xml <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <menu xmlns:android="http://schemas.android.com/apk/res/android">
            <item
                android:id="@+id/action_refresh"
                android:icon="@android:drawable/ic_menu_rotate"
                android:title="Refresh" />
            <item
                android:id="@+id/action_exit"
                android:icon="@android:drawable/ic_menu_close_clear_cancel"
                android:title="Exit" />
        </menu>
        XML

        # MainActivity.java (lengkap: user agent, download manager, bottom nav)
        cat > app/src/main/java/com/nexus/server/enterprise/MainActivity.java <<'JAVA'
        package com.nexus.server.enterprise;

        import android.app.DownloadManager;
        import android.content.Context;
        import android.content.Intent;
        import android.net.Uri;
        import android.os.Bundle;
        import android.os.Environment;
        import android.view.MenuItem;
        import android.webkit.DownloadListener;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.Toast;
        import androidx.annotation.NonNull;
        import androidx.appcompat.app.AppCompatActivity;
        import com.google.android.material.bottomnavigation.BottomNavigationView;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                webView = findViewById(R.id.webview);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                settings.setUserAgentString("Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Mobile Safari/537.36");

                webView.setWebViewClient(new WebViewClient());

                // DownloadManager untuk semua file (anti crash)
                webView.setDownloadListener(new DownloadListener() {
                    @Override
                    public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                        try {
                            DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                            String filename = Uri.parse(url).getLastPathSegment();
                            if (filename == null || filename.isEmpty()) filename = "download_" + System.currentTimeMillis();
                            request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, filename);
                            request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                            DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                            dm.enqueue(request);
                            Toast.makeText(MainActivity.this, "Downloading: " + filename, Toast.LENGTH_SHORT).show();
                        } catch (Exception e) {
                            Intent browser = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                            startActivity(browser);
                        }
                    }
                });

                webView.loadUrl("https://server-enterprise.pages.dev");

                BottomNavigationView bottomNav = findViewById(R.id.bottom_nav);
                bottomNav.setOnNavigationItemSelectedListener(new BottomNavigationView.OnNavigationItemSelectedListener() {
                    @Override
                    public boolean onNavigationItemSelected(@NonNull MenuItem item) {
                        int id = item.getItemId();
                        if (id == R.id.action_refresh) {
                            webView.reload();
                            Toast.makeText(MainActivity.this, "Reloading...", Toast.LENGTH_SHORT).show();
                            return true;
                        } else if (id == R.id.action_exit) {
                            finishAffinity();
                            return true;
                        }
                        return false;
                    }
                });
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) webView.goBack();
                else super.onBackPressed();
            }
        }
        JAVA

        # Generate gradle wrapper (gunakan gradle dari runner)
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

        # Tulis local.properties agar SDK ditemukan
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nexus-Server-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release (optional)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "Release v1.0.${{ github.run_number }}"
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
